<!-- ================= DATE QUESTIONS ================= -->

<div class="section-title">Date Questions</div>

<div class="field">
    <label for="dateOfBirth">
        Date of Birth <span class="required">*</span>
    </label>
    <input id="dateOfBirth" name="date_of_birth" type="date" required>
</div>

<div class="field">
    <label for="jobStartDate">
        When did you start your most recent job?
        <span class="required">*</span>
    </label>
    <input id="jobStartDate" name="job_start_date" type="month" required>
</div>

<div class="field">
    <label for="availableStartDate">
        What is your earliest available start date?
        <span class="required">*</span>
    </label>
    <input id="availableStartDate" name="available_start_date" type="date" required>
</div>
