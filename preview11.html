
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApplyR - Job Application Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 40px 20px;
        color: #222;
    }

    .container {
        max-width: 750px;
        margin: 40px auto;
        padding: 40px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    h1 {
        font-size: 26px;
        margin-bottom: 10px;
    }

    .description {
        color: #666;
        margin-bottom: 35px;
    }

    .question {
        margin-bottom: 30px;
    }

    .question label,
    .question-title {
        display: block;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .question input[type="text"],
    .question input[type="email"],
    .question input[type="tel"],
    .question input[type="number"],
    .question select,
    .question textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        background: white;
    }

    .question textarea {
        min-height: 100px;
        resize: vertical;
    }

    .radio-group {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .radio-group label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 400;
        margin: 0;
        cursor: pointer;
    }

    .date-container {
        display: flex;
        width: 100%;
        height: 48px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: white;
    }

    .date-container:focus-within {
        border-color: #2563eb;
    }

    .dropdown {
        position: relative;
        min-width: 0;
        flex: 1;
    }

    .dropdown.month {
        flex: 1.8;
    }

    .dropdown:not(:last-child)::after {
        content: "";
        position: absolute;
        right: 0;
        top: 10px;
        height: 26px;
        width: 1px;
        background: #d1d5db;
    }

    .dropdown-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 0 14px;
        border: none;
        background: transparent;
        font-size: 14px;
        color: #475569;
        cursor: pointer;
        text-align: left;
    }

    .dropdown-button span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .arrow {
        font-size: 11px;
        color: #64748b;
    }

    .dropdown-options {
        display: none;
        position: absolute;
        top: calc(100% + 3px);
        left: 0;
        width: 100%;
        min-width: 110px;
        max-height: 350px;
        overflow-y: auto;
        background: white;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        z-index: 100;
        padding: 4px;
    }

    .dropdown.open .dropdown-options {
        display: block;
    }

    .dropdown-option {
        display: block;
        width: 100%;
        padding: 11px 12px;
        border: none;
        background: white;
        text-align: left;
        font-size: 14px;
        cursor: pointer;
        border-radius: 5px;
    }

    .dropdown-option:hover,
    .dropdown-option:focus {
        background: #eff6ff;
        outline: none;
    }

    .dropdown-option.selected {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .submit-button {
        margin-top: 10px;
        background: #2563eb;
        color: white;
        border: none;
        padding: 13px 28px;
        border-radius: 7px;
        font-size: 15px;
        cursor: pointer;
    }

    .submit-button:hover {
        background: #1d4ed8;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: #f1f5f9;
        border-radius: 8px;
        display: none;
        white-space: pre-wrap;
        line-height: 1.7;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Job Application</h1>

    <p class="description">
        Please complete the following application questions.
    </p>

    <form id="application-form">

        <!-- QUESTION 1 -->
        <div class="question">
            <label for="full-name">1. Full Name</label>
            <input type="text" id="full-name" name="full_name" required>
        </div>

        <!-- QUESTION 2 -->
        <div class="question">
            <label for="email">2. Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- QUESTION 3 -->
        <div class="question">
            <label for="phone">3. Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <!-- QUESTION 4 -->
        <div class="question">
            <label for="experience">4. How many years of professional experience do you have?</label>
            <select id="experience" name="experience" required>
                <option value="">Select experience</option>
                <option value="0">Less than 1 year</option>
                <option value="1-2">1-2 years</option>
                <option value="3-5">3-5 years</option>
                <option value="6-10">6-10 years</option>
                <option value="10+">More than 10 years</option>
            </select>
        </div>

        <!-- QUESTION 5 -->
        <div class="question">
            <span class="question-title">5. Are you legally authorized to work in the United States?</span>
            <div class="radio-group">
                <label><input type="radio" name="authorized" value="Yes" required> Yes</label>
                <label><input type="radio" name="authorized" value="No"> No</label>
            </div>
        </div>

        <!-- QUESTION 6 -->
        <div class="question">
            <span class="question-title">6. Will you now or in the future require employment sponsorship?</span>
            <div class="radio-group">
                <label><input type="radio" name="sponsorship" value="Yes" required> Yes</label>
                <label><input type="radio" name="sponsorship" value="No"> No</label>
            </div>
        </div>

        <!-- QUESTION 7 -->
        <div class="question">
            <label for="education">7. What is your highest level of education?</label>
            <select id="education" name="education" required>
                <option value="">Select education level</option>
                <option>High School Diploma</option>
                <option>Associate Degree</option>
                <option>Bachelor's Degree</option>
                <option>Master's Degree</option>
                <option>Doctoral Degree</option>
                <option>Other</option>
            </select>
        </div>

        <!-- QUESTION 8: THREE-PART DATE DROPDOWN -->
        <div class="question">

            <label>8. Earliest Available Date</label>

            <div class="date-container">

                <div class="dropdown month" data-field="month">
                    <button type="button" class="dropdown-button" aria-expanded="false">
                        <span>Month</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-options" role="listbox" aria-label="Month"></div>
                </div>

                <div class="dropdown" data-field="day">
                    <button type="button" class="dropdown-button" aria-expanded="false">
                        <span>Day</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-options" role="listbox" aria-label="Day"></div>
                </div>

                <div class="dropdown" data-field="year">
                    <button type="button" class="dropdown-button" aria-expanded="false">
                        <span>Year</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-options" role="listbox" aria-label="Year"></div>
                </div>

            </div>

        </div>

        <!-- QUESTION 9 -->
        <div class="question">
            <label for="salary">9. What is your expected annual salary (USD)?</label>
            <input type="number" id="salary" name="salary" min="0" placeholder="e.g. 65000" required>
        </div>

        <!-- QUESTION 10 -->
        <div class="question">
            <span class="question-title">10. Are you willing to relocate for this position?</span>
            <div class="radio-group">
                <label><input type="radio" name="relocate" value="Yes" required> Yes</label>
                <label><input type="radio" name="relocate" value="No"> No</label>
            </div>
        </div>

        <!-- QUESTION 11 -->
        <div class="question">
            <label for="interest">11. Why are you interested in this position?</label>
            <textarea id="interest" name="interest" placeholder="Enter your response..." required></textarea>
        </div>

        <button type="submit" class="submit-button">
            Continue
        </button>

    </form>

    <div class="result" id="result"></div>

</div>

<script>

const months = [
    "January", "February", "March", "April",
    "May", "June", "July", "August",
    "September", "October", "November", "December"
];

const days = Array.from({length: 31}, (_, i) => String(i + 1));

const years = Array.from({length: 71}, (_, i) => String(2026 - i));

const options = {
    month: months,
    day: days,
    year: years
};

const selectedDate = {
    month: null,
    day: null,
    year: null
};

function closeDropdowns() {

    document.querySelectorAll(".dropdown").forEach(dropdown => {
        dropdown.classList.remove("open");
        dropdown.querySelector(".dropdown-button").setAttribute("aria-expanded", "false");
    });

}

document.querySelectorAll(".dropdown").forEach(dropdown => {

    const field = dropdown.dataset.field;
    const button = dropdown.querySelector(".dropdown-button");
    const optionContainer = dropdown.querySelector(".dropdown-options");

    options[field].forEach(value => {

        const option = document.createElement("button");

        option.type = "button";
        option.className = "dropdown-option";
        option.textContent = value;
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", "false");

        option.addEventListener("click", () => {

            selectedDate[field] = value;

            button.querySelector("span").textContent = value;

            optionContainer.querySelectorAll(".dropdown-option").forEach(item => {
                const selected = item === option;
                item.classList.toggle("selected", selected);
                item.setAttribute("aria-selected", String(selected));
            });

            closeDropdowns();

        });

        optionContainer.appendChild(option);

    });

    button.addEventListener("click", () => {

        const wasOpen = dropdown.classList.contains("open");

        closeDropdowns();

        if (!wasOpen) {
            dropdown.classList.add("open");
            button.setAttribute("aria-expanded", "true");
        }

    });

});

document.addEventListener("click", event => {

    if (!event.target.closest(".dropdown")) {
        closeDropdowns();
    }

});

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeDropdowns();
    }

});

document.getElementById("application-form").addEventListener("submit", event => {

    event.preventDefault();

    const result = document.getElementById("result");

    if (!selectedDate.month || !selectedDate.day || !selectedDate.year) {
        result.style.display = "block";
        result.textContent = "Please complete Question 8: Earliest Available Date.";
        return;
    }

    const monthIndex = months.indexOf(selectedDate.month);
    const day = Number(selectedDate.day);
    const year = Number(selectedDate.year);
    const date = new Date(year, monthIndex, day);

    if (
        date.getFullYear() !== year ||
        date.getMonth() !== monthIndex ||
        date.getDate() !== day
    ) {
        result.style.display = "block";
        result.textContent = "Please select a valid date for Question 8.";
        return;
    }

    const formData = new FormData(event.target);

    const answers = Object.fromEntries(formData.entries());

    answers.earliest_available_date =
        selectedDate.month + " " +
        selectedDate.day + ", " +
        selectedDate.year;

    result.style.display = "block";

    result.textContent =
        "Application Test Completed Successfully!\n\n" +
        JSON.stringify(answers, null, 2);

});

</script>

</body>
</html>
