<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApplyR - Search Form Test</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:40px 20px;color:#222}.container{max-width:750px;margin:40px auto;padding:40px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.04)}h1{font-size:26px;margin:0 0 10px}.description{color:#666;margin-bottom:35px}.question{margin-bottom:30px}.question>label{display:block;font-size:15px;font-weight:600;margin-bottom:10px}.search-wrapper{position:relative}.search-input{width:100%;height:48px;padding:0 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:14px Arial,sans-serif;outline:none}.search-input:focus{border-color:#2563eb}.search-options{display:none;position:absolute;top:calc(100% + 3px);left:0;width:100%;max-height:240px;overflow-y:auto;padding:4px;background:#fff;border:1px solid #d1d5db;border-radius:10px;box-shadow:0 6px 15px rgba(0,0,0,.12);z-index:100}.search-wrapper.open .search-options{display:block}.dropdown-option{display:block;width:100%;padding:11px 12px;border:0;background:#fff;text-align:left;font-size:14px;cursor:pointer;border-radius:5px;color:#222}.dropdown-option:hover,.dropdown-option:focus{background:#eff6ff;outline:none}.empty-option{padding:12px;color:#64748b;font-size:14px}.helper{font-size:12px;color:#64748b;margin-top:7px}.selected-skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.skill-chip{display:inline-flex;align-items:center;gap:8px;background:#dbeafe;color:#1d4ed8;padding:7px 10px;border-radius:20px;font-size:13px}.skill-chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px}.submit-button{margin-top:10px;background:#2563eb;color:#fff;border:0;padding:13px 28px;border-radius:7px;font-size:15px;cursor:pointer}.result{margin-top:20px;padding:15px;border-radius:8px;display:none;white-space:pre-line;line-height:1.6}.result.error{background:#fef2f2;color:#991b1b}.result.success{background:#f0fdf4;color:#166534}@media(max-width:500px){.container{padding:22px}}
</style>
</head>
<body>
<div class="container">
<h1>Job Application</h1>
<p class="description">Please complete the following application questions.</p>
<div class="question"><label for="skills-search">1. What skills do you have?</label><div class="search-wrapper" id="skills-wrapper"><input id="skills-search" class="search-input" type="text" placeholder="Search for your skills..." autocomplete="off" aria-label="Search for skills" aria-expanded="false" aria-controls="skills-options"><div class="search-options" id="skills-options" role="listbox" aria-label="Skill suggestions"></div></div><div class="helper">Search and select multiple skills.</div><div class="selected-skills" id="selected-skills"></div></div>
<div class="question"><label for="university-search">2. Which university do you attend or did you attend?</label><div class="search-wrapper" id="university-wrapper"><input id="university-search" class="search-input" type="text" placeholder="Search for your university..." autocomplete="off" aria-label="Search for university" aria-expanded="false" aria-controls="university-options"><div class="search-options" id="university-options" role="listbox" aria-label="University suggestions"></div></div><div class="helper">Type a university name and choose a result.</div></div>
<div class="question"><label for="city-search">3. What city do you live in?</label><div class="search-wrapper" id="city-wrapper"><input id="city-search" class="search-input" type="text" placeholder="Search for your city..." autocomplete="off" aria-label="Search for city" aria-expanded="false" aria-controls="city-options"><div class="search-options" id="city-options" role="listbox" aria-label="City suggestions"></div></div><div class="helper">Type a city name and choose a result.</div></div>
<button class="submit-button" type="button" id="submit-button">Continue</button><div class="result" id="result" role="status" aria-live="polite"></div>
</div>
<script>
const data={skills:["Python","Java","JavaScript","TypeScript","C","C++","C#","HTML","CSS","React","Next.js","Node.js","Express.js","FastAPI","Django","Flask","SQL","PostgreSQL","MySQL","MongoDB","Supabase","Git","GitHub","Docker","Kubernetes","AWS","Microsoft Azure","Google Cloud","Linux","REST APIs","GraphQL","Playwright","Selenium","Machine Learning","Artificial Intelligence","Data Science","Data Analysis","Pandas","NumPy","PyTorch","TensorFlow","Scikit-learn","Communication","Leadership","Problem Solving","Teamwork","Agile","Scrum"],university:["University of North Carolina at Charlotte","University of North Carolina at Chapel Hill","North Carolina State University","Duke University","Wake Forest University","East Carolina University","Appalachian State University","University of North Carolina at Greensboro","University of North Carolina Wilmington","North Carolina A&T State University","University of North Carolina at Asheville","Western Carolina University","Elon University","Davidson College","Clemson University","University of South Carolina","Virginia Tech","University of Virginia","Georgia Institute of Technology","Georgia State University","University of Georgia","University of Florida","Florida State University","University of Central Florida","Harvard University","Stanford University","Massachusetts Institute of Technology","Carnegie Mellon University","University of California, Berkeley","University of California, Los Angeles","New York University","Columbia University","Cornell University","Purdue University","Ohio State University","University of Michigan","Pennsylvania State University","University of Texas at Austin","Texas A&M University","Arizona State University","University of Washington"],city:["Atlanta","Austin","Baltimore","Boston","Charlotte","Chicago","Cincinnati","Cleveland","Columbia","Columbus","Dallas","Denver","Detroit","Durham","Fayetteville","Fort Worth","Greensboro","Greenville","Houston","Indianapolis","Jacksonville","Kansas City","Las Vegas","Los Angeles","Miami","Minneapolis","Nashville","New Orleans","New York","Orlando","Philadelphia","Phoenix","Pittsburgh","Portland","Raleigh","Richmond","Sacramento","San Antonio","San Diego","San Francisco","San Jose","Seattle","Tampa","Washington","Wake Forest","Wilmington","Winston-Salem","Youngsville"]};
const selected={skills:[],university:null,city:null};
function closeAll(except=null){document.querySelectorAll('.search-wrapper').forEach(wrapper=>{if(wrapper!==except){wrapper.classList.remove('open');wrapper.querySelector('input').setAttribute('aria-expanded','false')}})}
function renderSkills(){const holder=document.getElementById('selected-skills');holder.replaceChildren();selected.skills.forEach(skill=>{const chip=document.createElement('span');chip.className='skill-chip';chip.append(document.createTextNode(skill));const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label',`Remove ${skill}`);remove.addEventListener('click',()=>{selected.skills=selected.skills.filter(item=>item!==skill);renderSkills()});chip.appendChild(remove);holder.appendChild(chip)})}
function setupSearch(field){const input=document.getElementById(`${field}-search`),wrapper=document.getElementById(`${field}-wrapper`),options=document.getElementById(`${field}-options`);function close(){wrapper.classList.remove('open');input.setAttribute('aria-expanded','false')}function choose(value){if(field==='skills'){if(!selected.skills.includes(value))selected.skills.push(value);renderSkills();input.value=''}else{selected[field]=value;input.value=value}close()}function render(){const query=input.value.trim().toLowerCase();const matches=data[field].filter(value=>value.toLowerCase().includes(query)&&(field!=='skills'||!selected.skills.includes(value)));options.replaceChildren();if(!matches.length){const empty=document.createElement('div');empty.className='empty-option';empty.textContent=`No matching ${field}`;options.appendChild(empty)}else{matches.forEach(value=>{const option=document.createElement('button');option.type='button';option.className='dropdown-option';option.setAttribute('role','option');option.textContent=value;option.addEventListener('click',()=>choose(value));options.appendChild(option)})}closeAll(wrapper);wrapper.classList.add('open');input.setAttribute('aria-expanded','true')}input.addEventListener('focus',render);input.addEventListener('input',()=>{if(field!=='skills')selected[field]=null;render()});input.addEventListener('keydown',event=>{if(event.key==='Enter'&&wrapper.classList.contains('open')){const first=options.querySelector('button');if(first){event.preventDefault();first.click()}}if(event.key==='Escape')close()});}
['skills','university','city'].forEach(setupSearch);
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrapper'))closeAll()});
document.getElementById('submit-button').addEventListener('click',()=>{const result=document.getElementById('result'),errors=[];if(!selected.skills.length)errors.push('Select at least one skill.');if(!selected.university||document.getElementById('university-search').value!==selected.university)errors.push('Search for and select a university.');if(!selected.city||document.getElementById('city-search').value!==selected.city)errors.push('Search for and select a city.');result.style.display='block';result.className=`result ${errors.length?'error':'success'}`;result.textContent=errors.length?errors.join('\n'):`Application Answers:\nSkills: ${selected.skills.join(', ')}\nUniversity: ${selected.university}\nCity: ${selected.city}`});
</script>
</body>
</html>
