<!-- SKILLS SECTION -->

<div class="section-title">Skills</div>

<div class="field">

    <label for="skill">
        Skills <span class="required">*</span>
    </label>

    <div class="hint" style="margin-bottom: 8px;">
        Search for and add skills that are relevant to your experience.
        You may add multiple skills.
    </div>

    <!-- Selected skills appear here -->
    <div id="selectedSkills" class="selected-skills"></div>

    <!-- Search input -->
    <div class="skill-search-wrapper">

        <input
            id="skill"
            name="skill_search"
            type="text"
            autocomplete="off"
            placeholder="Search for a skill..."
        >

        <div
            id="skillSuggestions"
            class="autocomplete-list skill-list">
        </div>

    </div>

    <!-- Hidden value representing what a real form might submit -->
    <input
        type="hidden"
        id="skillsValue"
        name="skills"
        required
    >

    <div class="hint">
        Start typing a skill, then select it from the suggestions.
    </div>

</div>


<style>

    /* =========================
       SKILLS
       ========================= */

    .selected-skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
    }

    .skill-chip {
        display: flex;
        align-items: center;
        gap: 7px;

        background: #e8f0fe;
        border: 1px solid #b8cdf5;

        padding: 7px 10px;
        border-radius: 20px;

        font-size: 14px;
    }

    .skill-chip button {
        width: auto;
        margin: 0;
        padding: 0;

        border: none;
        background: none;

        color: #555;
        font-size: 17px;

        cursor: pointer;
    }

    .skill-chip button:hover {
        background: none;
        color: #d93025;
    }

    .skill-search-wrapper {
        position: relative;
    }

    .skill-list {
        top: 45px;
    }

</style>


<script>

/* =========================================
   REALISTIC JOB APPLICATION SKILLS FIELD
   ========================================= */

const availableSkills = [

    /* Programming Languages */

    "Python",
    "Java",
    "JavaScript",
    "TypeScript",
    "C",
    "C++",
    "C#",
    "Go",
    "Rust",
    "Swift",
    "Kotlin",
    "PHP",
    "Ruby",
    "R",
    "MATLAB",


    /* Web Development */

    "HTML",
    "CSS",
    "React",
    "Next.js",
    "Vue.js",
    "Angular",
    "Node.js",
    "Express.js",
    "FastAPI",
    "Django",
    "Flask",
    "Spring Boot",
    "REST APIs",
    "GraphQL",


    /* Databases */

    "SQL",
    "MySQL",
    "PostgreSQL",
    "MongoDB",
    "SQLite",
    "Redis",
    "Supabase",
    "Firebase",


    /* Cloud / DevOps */

    "AWS",
    "Microsoft Azure",
    "Google Cloud Platform",
    "Docker",
    "Kubernetes",
    "Git",
    "GitHub",
    "GitLab",
    "CI/CD",
    "Linux",


    /* AI / Machine Learning */

    "Machine Learning",
    "Artificial Intelligence",
    "Deep Learning",
    "Natural Language Processing",
    "Computer Vision",
    "Large Language Models",
    "Generative AI",
    "Prompt Engineering",
    "PyTorch",
    "TensorFlow",
    "Scikit-learn",
    "LangChain",
    "OpenAI API",


    /* Data */

    "Data Analysis",
    "Data Science",
    "Pandas",
    "NumPy",
    "Power BI",
    "Tableau",
    "Data Visualization",
    "ETL",
    "Statistics",


    /* Software Engineering */

    "Object-Oriented Programming",
    "Data Structures",
    "Algorithms",
    "Software Development",
    "Software Testing",
    "Unit Testing",
    "API Development",
    "Backend Development",
    "Frontend Development",
    "Full Stack Development",
    "Microservices",
    "Agile Development",
    "Scrum",


    /* General Professional Skills */

    "Problem Solving",
    "Communication",
    "Leadership",
    "Teamwork",
    "Project Management",
    "Technical Writing",
    "Critical Thinking"

];


const skillInput =
    document.getElementById("skill");

const skillSuggestions =
    document.getElementById("skillSuggestions");

const selectedSkillsContainer =
    document.getElementById("selectedSkills");

const skillsValue =
    document.getElementById("skillsValue");


let selectedSkills = [];

let filteredSkills = [];

let skillSelectedIndex = -1;



/* =========================================
   SEARCH SKILLS
   ========================================= */

skillInput.addEventListener("input", function() {

    const search =
        skillInput.value
            .trim()
            .toLowerCase();


    skillSuggestions.innerHTML = "";

    skillSelectedIndex = -1;


    if (!search) {

        skillSuggestions.style.display = "none";

        return;

    }


    filteredSkills =
        availableSkills.filter(skill =>

            skill
                .toLowerCase()
                .includes(search)

            &&

            !selectedSkills.includes(skill)

        );


    /*
        Limit suggestions like many real
        job application autocomplete fields.
    */

    filteredSkills =
        filteredSkills.slice(0, 8);


    if (filteredSkills.length === 0) {

        skillSuggestions.style.display = "none";

        return;

    }


    filteredSkills.forEach((skill, index) => {

        const item =
            document.createElement("div");

        item.className =
            "autocomplete-item";

        item.textContent =
            skill;


        item.addEventListener(
            "mousedown",
            function() {

                addSkill(skill);

            }
        );


        skillSuggestions.appendChild(item);

    });


    skillSuggestions.style.display =
        "block";

});



/* =========================================
   KEYBOARD CONTROL

   Tests:

   ArrowDown
   ArrowUp
   Enter
   Escape
   ========================================= */

skillInput.addEventListener(
    "keydown",
    function(event) {

        const items =
            skillSuggestions
                .querySelectorAll(
                    ".autocomplete-item"
                );


        /* ARROW DOWN */

        if (event.key === "ArrowDown") {

            event.preventDefault();


            if (items.length === 0)
                return;


            skillSelectedIndex++;


            if (
                skillSelectedIndex
                >= items.length
            ) {

                skillSelectedIndex = 0;

            }


            updateSkillHighlight();

        }


        /* ARROW UP */

        else if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();


            if (items.length === 0)
                return;


            skillSelectedIndex--;


            if (
                skillSelectedIndex < 0
            ) {

                skillSelectedIndex =
                    items.length - 1;

            }


            updateSkillHighlight();

        }


        /* ENTER */

        else if (
            event.key === "Enter"
        ) {

            if (
                skillSelectedIndex >= 0
                &&
                filteredSkills[
                    skillSelectedIndex
                ]
            ) {

                event.preventDefault();


                addSkill(
                    filteredSkills[
                        skillSelectedIndex
                    ]
                );

            }

        }


        /* ESCAPE */

        else if (
            event.key === "Escape"
        ) {

            skillSuggestions.style.display =
                "none";

            skillSelectedIndex = -1;

        }

    }
);



/* =========================================
   HIGHLIGHT CURRENT OPTION
   ========================================= */

function updateSkillHighlight() {

    const items =
        skillSuggestions
            .querySelectorAll(
                ".autocomplete-item"
            );


    items.forEach(item => {

        item.classList.remove("active");

    });


    if (
        skillSelectedIndex >= 0
        &&
        items[skillSelectedIndex]
    ) {

        items[
            skillSelectedIndex
        ].classList.add("active");


        items[
            skillSelectedIndex
        ].scrollIntoView({

            block: "nearest"

        });

    }

}



/* =========================================
   ADD SKILL
   ========================================= */

function addSkill(skill) {

    if (
        selectedSkills.includes(skill)
    ) {

        return;

    }


    selectedSkills.push(skill);


    /*
        Clear the search field just like
        a real application.
    */

    skillInput.value = "";


    skillSuggestions.innerHTML = "";

    skillSuggestions.style.display =
        "none";


    skillSelectedIndex = -1;


    renderSelectedSkills();


    /*
        Keep keyboard focus on the field
        so another skill can immediately
        be entered.
    */

    skillInput.focus();

}



/* =========================================
   REMOVE SKILL
   ========================================= */

function removeSkill(skill) {

    selectedSkills =
        selectedSkills.filter(
            item => item !== skill
        );


    renderSelectedSkills();

}



/* =========================================
   RENDER SELECTED SKILLS
   ========================================= */

function renderSelectedSkills() {

    selectedSkillsContainer.innerHTML = "";


    selectedSkills.forEach(skill => {

        const chip =
            document.createElement("div");

        chip.className =
            "skill-chip";


        const text =
            document.createElement("span");

        text.textContent =
            skill;


        const removeButton =
            document.createElement("button");

        removeButton.type =
            "button";

        removeButton.textContent =
            "×";

        removeButton.setAttribute(
            "aria-label",
            "Remove " + skill
        );


        removeButton.onclick =
            function() {

                removeSkill(skill);

            };


        chip.appendChild(text);

        chip.appendChild(
            removeButton
        );


        selectedSkillsContainer
            .appendChild(chip);

    });


    /*
        This is the actual value that
        would be submitted by the form.

        Example:

        Python,Java,SQL,React
    */

    skillsValue.value =
        selectedSkills.join(",");

}



/* =========================================
   CLOSE SUGGESTIONS ON BLUR
   ========================================= */

skillInput.addEventListener(
    "blur",
    function() {

        setTimeout(function() {

            skillSuggestions.style.display =
                "none";

        }, 150);

    }
);

</script>
