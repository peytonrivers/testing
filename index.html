<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Graduation Date Test</title>

<style>

/* ==========================================
   PAGE STYLING
   ========================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}


/* ==========================================
   HEADER
   ========================================== */

.header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 20px 40px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 5px 0 0;
    color: #666;
}


/* ==========================================
   MAIN CONTAINER
   ========================================== */

.container {
    width: 700px;
    max-width: 90%;
    margin: 35px auto;
    background: white;
    padding: 35px;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

.section-title {
    margin-top: 35px;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ddd;
    font-size: 18px;
    font-weight: bold;
}


/* ==========================================
   QUESTION FIELDS
   ========================================== */

.field {
    margin-bottom: 24px;
    position: relative;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.required {
    color: #d93025;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: 2px solid #4285f4;
    border-color: #4285f4;
}

.hint {
    margin-top: 6px;
    color: #777;
    font-size: 13px;
}


/* ==========================================
   SUBMIT BUTTON
   ========================================== */

.submit-button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 5px;
    background: #1769aa;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-button:hover {
    background: #12558a;
}


/* ==========================================
   SUCCESS MESSAGE
   ========================================== */

#result {
    display: none;
    margin-top: 25px;
    padding: 15px;
    background: #e9f7ef;
    border: 1px solid #79c99e;
    border-radius: 5px;
}

.error {
    border-color: red !important;
}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
     ========================================== -->

<div class="header">

    <h1>Acme Technologies</h1>

    <p>
        Graduation Date Testing
    </p>

</div>



<!-- ==========================================
     MAIN PAGE
     ========================================== -->

<div class="container">

    <h2>Education Dates</h2>

    <p>
        Please enter your education start and graduation dates.
    </p>


    <div class="section-title">
        Graduation Information
    </div>



    <!-- ==========================================
         QUESTION 1
         TEXT OR CALENDAR
         ========================================== -->

    <div class="field">

        <label for="graduationStart">

            Graduation Start Date

            <span class="required">
                *
            </span>

        </label>

        <input
            id="graduationStart"
            name="graduation_start"
            type="date"
            required
        >

        <div class="hint">
            You can type the date or use the calendar.
        </div>

    </div>



    <!-- ==========================================
         QUESTION 2
         CALENDAR ONLY
         ========================================== -->

    <div class="field">

        <label for="graduationEnd">

            Graduation End Date

            <span class="required">
                *
            </span>

        </label>

        <input
            id="graduationEnd"
            name="graduation_end"
            type="date"
            required
        >

        <div class="hint">
            Select your graduation date.
        </div>

    </div>



    <!-- ==========================================
         SUBMIT
         ========================================== -->

    <button
        type="button"
        class="submit-button"
        onclick="submitApplication()"
    >
        Submit
    </button>


    <div id="result">

        Graduation dates successfully completed.

    </div>

</div>



<script>

/* ==========================================
   CALENDAR-ONLY END DATE
   ========================================== */

const graduationEndInput =
    document.getElementById("graduationEnd");


/*
Block normal keyboard entry into the
Graduation End Date field.
*/

graduationEndInput.addEventListener(
    "keydown",
    function(event) {

        /*
        Tab is still allowed so keyboard
        navigation continues to work.
        */

        if (event.key !== "Tab") {

            event.preventDefault();

        }

    }
);


/*
Block pasting a date.
*/

graduationEndInput.addEventListener(
    "paste",
    function(event) {

        event.preventDefault();

    }
);


/*
Block dragging text into the input.
*/

graduationEndInput.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

    }
);


/*
When the field is clicked, open the
browser's calendar picker.
*/

graduationEndInput.addEventListener(
    "click",
    function() {

        if (
            typeof graduationEndInput.showPicker ===
            "function"
        ) {

            try {

                graduationEndInput.showPicker();

            }

            catch (error) {

                /*
                If showPicker is unavailable,
                use the browser's normal
                date-input behavior.
                */

            }

        }

    }
);



/* ==========================================
   SUBMIT VALIDATION
   ========================================== */

function submitApplication() {

    const startDate =
        document.getElementById(
            "graduationStart"
        );

    const endDate =
        document.getElementById(
            "graduationEnd"
        );


    startDate.classList.remove(
        "error"
    );

    endDate.classList.remove(
        "error"
    );


    let valid = true;


    if (!startDate.value) {

        startDate.classList.add(
            "error"
        );

        valid = false;

    }


    if (!endDate.value) {

        endDate.classList.add(
            "error"
        );

        valid = false;

    }


    if (!valid) {

        alert(
            "Please complete both graduation dates."
        );

        return;

    }


    document.getElementById(
        "result"
    ).style.display =
        "block";

}

</script>


</body>

</html>
