<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Graduation Month Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 20px 40px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 5px 0 0;
    color: #666;
}

.container {
    width: 700px;
    max-width: 90%;
    margin: 35px auto;
    background: white;
    padding: 35px;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

.section-title {
    margin-top: 35px;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ddd;
    font-size: 18px;
    font-weight: bold;
}

.field {
    margin-bottom: 24px;
    position: relative;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.required {
    color: #d93025;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: 2px solid #4285f4;
    border-color: #4285f4;
}

.hint {
    margin-top: 6px;
    color: #777;
    font-size: 13px;
}

.test-type {
    display: inline-block;
    margin-bottom: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    background: #eef2f7;
    color: #555;
    font-size: 12px;
    font-weight: bold;
}

.submit-button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 5px;
    background: #1769aa;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-button:hover {
    background: #12558a;
}

#result {
    display: none;
    margin-top: 25px;
    padding: 15px;
    background: #e9f7ef;
    border: 1px solid #79c99e;
    border-radius: 5px;
}

.error {
    border-color: red !important;
}

</style>
</head>

<body>

<div class="header">
    <h1>Acme Technologies</h1>
    <p>Graduation Date Testing</p>
</div>

<div class="container">

    <h2>Education Dates</h2>

    <p>
        Please enter your graduation month.
    </p>

    <div class="section-title">
        Month Input
    </div>

    <!-- QUESTION 4 -->
    <div class="field">

        <div class="test-type">
            MONTH — PICKER ONLY
        </div>

        <label for="graduationEndMonth">
            Graduation End Month
            <span class="required">*</span>
        </label>

        <input
            id="graduationEndMonth"
            name="graduation_end_month"
            type="month"
            required
        >

        <div class="hint">
            Keyboard entry is blocked. Select the month and year using the picker.
        </div>

    </div>

    <button
        type="button"
        class="submit-button"
        onclick="submitApplication()"
    >
        Submit
    </button>

    <div id="result">
        Graduation date successfully completed.
    </div>

</div>

<script>

const graduationEndMonthInput =
    document.getElementById("graduationEndMonth");


/*
Block keyboard entry.
Tab is still allowed.
*/
graduationEndMonthInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Tab") {
            event.preventDefault();
        }

    }
);


/*
Block pasting.
*/
graduationEndMonthInput.addEventListener(
    "paste",
    function(event) {
        event.preventDefault();
    }
);


/*
Block dragging text into the field.
*/
graduationEndMonthInput.addEventListener(
    "drop",
    function(event) {
        event.preventDefault();
    }
);


/*
Open the browser's native month picker
when the field is clicked.
*/
graduationEndMonthInput.addEventListener(
    "click",
    function() {

        if (
            typeof graduationEndMonthInput.showPicker === "function"
        ) {

            try {
                graduationEndMonthInput.showPicker();
            }
            catch (error) {
                // Fall back to normal browser behavior.
            }

        }

    }
);


/*
Submit validation.
*/
function submitApplication() {

    graduationEndMonthInput.classList.remove("error");

    if (!graduationEndMonthInput.value) {

        graduationEndMonthInput.classList.add("error");

        alert("Please select a graduation month.");

        return;
    }

    document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
