function setupSearch(inputId,listId,options,requiresEnter){
 const input=document.getElementById(inputId),list=document.getElementById(listId);let filtered=[],active=-1,chosen=null,loaded=false;
 function close(){list.classList.remove('open');input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');active=-1;}
 function select(value){chosen=value;input.value=value;input.classList.remove('error');loaded=false;close();}
 function highlight(){const nodes=[...list.children];nodes.forEach((node,i)=>{node.classList.toggle('active',i===active);node.setAttribute('aria-selected',String(i===active));});if(active>=0){input.setAttribute('aria-activedescendant',nodes[active].id);nodes[active].scrollIntoView({block:'nearest'});}}
 function render(){const q=input.value.trim().toLowerCase();filtered=q?options.filter(v=>v.toLowerCase().includes(q)): (inputId==='phoneCode'?options:[]);list.replaceChildren();active=-1;if(!filtered.length){close();return;}filtered.forEach((value,i)=>{const item=document.createElement('div');item.className='option';item.id=listId+'-option-'+i;item.setAttribute('role','option');item.setAttribute('aria-selected','false');item.textContent=value;item.addEventListener('mousedown',e=>{e.preventDefault();select(value);});list.appendChild(item);});list.classList.add('open');input.setAttribute('aria-expanded','true');}
 input.addEventListener('focus',()=>{if(inputId==='phoneCode' && !chosen)render();});
 input.addEventListener('click',()=>{if(inputId==='phoneCode' && !chosen)render();});
 input.addEventListener('input',()=>{chosen=null;input.classList.remove('error');loaded=false;if(requiresEnter)close();else render();});
 input.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return;}if(e.key==='Enter'){
 e.preventDefault();if(list.classList.contains('open')){if(active>=0)select(filtered[active]);else if(requiresEnter)close();}else if(requiresEnter){loaded=true;render();}return;}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!list.classList.contains('open'))return;e.preventDefault();active=(active+(e.key==='ArrowDown'?1:-1)+filtered.length)%filtered.length;highlight();}});
 input.addEventListener('blur',()=>setTimeout(close,120));
 return {input,getValue:()=>chosen};
}
