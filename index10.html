<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar | Software Engineering Application</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#18243a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#102b53;color:white;padding:22px max(20px,calc((100vw - 980px)/2))}.top h1{font-size:23px;margin:0 0 5px}.top p{margin:0;color:#cbd9ee}.wrap{max-width:980px;margin:28px auto;padding:0 18px}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px}.side,.card{background:white;border:1px solid #dce3ee;border-radius:12px;padding:22px}.side{align-self:start}.side button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:transparent;color:#526078;cursor:pointer}.side button.active{background:#e9f0ff;color:#1c4ea1;font-weight:700}.side button:disabled{cursor:default}.muted{color:#66758b}.small{font-size:13px}.progress{height:8px;background:#e9edf4;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#2563eb;width:20%;transition:width .2s}h2{margin:0 0 8px;font-size:22px}h3{font-size:16px;margin:25px 0 15px;padding-top:12px;border-top:1px solid #e5eaf1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 18px;font-size:13px;font-weight:600}.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{font:inherit;font-weight:400;font-size:14px;padding:11px;border:1px solid #cbd5e1;border-radius:7px;width:100%;background:white;color:#18243a;min-height:43px}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #93b7ff}.required{color:#c43434}.options{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:6px}.option{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400}.option input{accent-color:#2563eb}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;border-top:1px solid #e5eaf1;padding-top:20px}.btn{border:1px solid #cbd5e1;background:white;color:#1e293b;padding:11px 19px;border-radius:8px;font-size:14px;font-weight:650;cursor:pointer}.btn.primary{background:#2563eb;border-color:#2563eb;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.error{color:#b42318;font-size:13px;min-height:18px}.review{border:1px solid #e1e7f0;border-radius:8px;padding:15px;margin:12px 0}.review p{font-size:13px;margin:9px 0;overflow-wrap:anywhere}.review strong{display:inline-block;min-width:160px}.success{text-align:center;padding:45px 10px}.success .check{font-size:45px;color:#14804a}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex;flex-wrap:wrap;gap:4px}.side button{width:auto;flex:1;font-size:11px;padding:8px}.grid{grid-template-columns:1fr}.card{padding:17px}}
</style></head><body><header class="top"><h1>Northstar Technologies</h1><p>Software Engineering Intern · 2027 · Mock Recruiting Portal</p></header><main class="wrap"><div class="layout"><aside class="side" id="nav"></aside><section class="card"><div class="small muted" id="step"></div><div class="progress"><div class="bar" id="bar"></div></div><form id="form" novalidate><div id="content"></div><div class="error" id="error" role="alert"></div><div class="actions"><button type="button" class="btn" id="back">← Back</button><button type="button" class="btn primary" id="next">Save & Continue →</button></div></form></section></div><p class="small muted">Testing environment only. Data stays in this browser's local storage. No real job application is submitted.</p></main>
<script>
const titles=['Personal Information','Education','Experience & Skills','Eligibility & Questions','Review & Submit'];let page=0;let answers={};try{answers=JSON.parse(localStorage.getItem('mockSWEAnswers')||'{}')}catch{};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function input(name,label,type='text',req=false,placeholder=''){return `<label class="field">${label}${req?' <span class="required">*</span>':''}<input name="${name}" type="${type}" ${req?'required':''} placeholder="${esc(placeholder)}"></label>`}
function select(name,label,opts,req=false){return `<label class="field">${label}${req?' <span class="required">*</span>':''}<select name="${name}" ${req?'required':''}><option value="">Select an option</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`}
function text(name,label){return `<label class="field">${label}<textarea name="${name}" placeholder="Enter your response..."></textarea></label>`}
function choice(name,label,opts,multi=false,req=false){return `<div class="field"><span>${label}${req?' <span class="required">*</span>':''}</span><div class="options">${opts.map(x=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="${name}" value="${esc(x)}" ${req?'data-required-group="true"':''}>${esc(x)}</label>`).join('')}</div></div>`}
const yesno=['Yes','No'];const languages=['Python','Java','JavaScript','TypeScript','C','C++','C#','Go','Rust','Swift','Kotlin','SQL'];
const screens=[
()=>`<h2>Personal Information</h2><p class="muted small">Provide your contact details.</p><div class="grid">${input('firstName','Legal first name','text',true)}${input('lastName','Legal last name','text',true)}${input('preferredName','Preferred name')}${input('email','Email address','email',true)}${input('phone','Phone number','tel',true)}${input('country','Country','text',true)}${input('city','City','text',true)}${select('state','State / region',['North Carolina','South Carolina','Virginia','Georgia','Florida','New York','California','Texas','Other'],true)}${input('postal','Postal / ZIP code','text',true)}${input('linkedin','LinkedIn URL','url')}${input('github','GitHub URL','url')}${input('portfolio','Portfolio URL','url')}</div>${choice('relocation','Are you willing to relocate?',yesno)}${select('source','How did you find this opening?',['LinkedIn','Handshake','Career fair','Company website','Referral','Other'])}`,
()=>`<h2>Education</h2><p class="muted small">Tell us about your academic background.</p>${input('school','University or college','text',true)}<div class="grid">${select('degree','Degree',['Associate','Bachelor of Science','Bachelor of Arts','Master of Science','PhD','Other'],true)}${input('major','Major','text',true)}${input('minor','Minor / concentration')}${input('gpa','GPA','number')}${input('educationStart','Enrollment start date','month',true)}${input('graduation','Expected graduation date','month',true)}</div>${select('year','Academic year',['Freshman','Sophomore','Junior','Senior','Graduate'])}${choice('enrolled','Will you be enrolled during this internship?',yesno)}${text('coursework','Relevant coursework')}${choice('schoolProject','Have you completed a programming project for a course?',yesno)}${text('academicProject','Describe an academic project')}`,
()=>`<h2>Experience & Technical Skills</h2><p class="muted small">Share your professional and project experience.</p>${choice('priorExperience','Have you worked in a software engineering role?',yesno)}<div class="grid">${input('employer','Most recent employer')}${input('jobTitle','Position title')}${input('employmentStart','Employment start date','month')}${input('employmentEnd','Employment end date','month')}</div>${choice('currentlyEmployed','Do you currently hold this position?',yesno)}${text('jobDuties','Describe your responsibilities and impact')}<h3>Technical background</h3>${choice('languages','Programming languages you have used',languages,true)}${select('strongestLanguage','Strongest programming language',languages)}${choice('tools','Frameworks, platforms, and tools',['React','Node.js','FastAPI','Django','Spring Boot','Git','Docker','AWS','Azure','PostgreSQL','MySQL','Playwright','Kubernetes'],true)}${select('experienceYears','Years of programming experience',['Less than 1 year','1–2 years','3–4 years','5+ years'])}${select('dsa','Data structures & algorithms proficiency',['Beginner','Intermediate','Advanced','Expert'])}${input('projectName','Most significant project name','text',true)}${text('projectDetails','Describe the architecture and impact of your project')}${input('projectLink','Project repository or demo URL','url')}<h3>Documents</h3><label class="field">Resume (PDF or DOCX)<input type="file" name="resume" accept=".pdf,.doc,.docx"></label><label class="field">Cover letter (optional)<input type="file" name="coverLetter" accept=".pdf,.doc,.docx"></label><p class="muted small">File names are remembered for review; file contents are not uploaded or stored.</p>`,
()=>`<h2>Eligibility & Additional Questions</h2><p class="muted small">Answer the following work eligibility and technical questions.</p>${choice('authorized','Are you authorized to work in the United States?',yesno,false,true)}${choice('sponsorship','Will you require visa sponsorship now or in the future?',yesno,false,true)}${choice('adult','Are you at least 18 years old?',yesno)}${select('workMode','Preferred work arrangement',['On-site','Hybrid','Remote','No preference'])}<div class="grid">${input('availableStart','Earliest internship start date','date')}${input('availableEnd','Latest internship end date','date')}</div>${choice('fullTime','Can you work 40 hours per week?',yesno)}${select('office','Preferred office',['Charlotte, NC','Raleigh, NC','Austin, TX','New York, NY','San Francisco, CA','Remote','No preference'])}${choice('cloud','Have you deployed a cloud application?',yesno)}${choice('api','Have you developed REST APIs?',yesno)}${choice('databases','Have you used relational databases?',yesno)}${choice('tests','Have you written automated tests?',yesno)}${text('hardProblem','Describe a challenging technical problem you solved')}${text('motivation','Why do you want this internship?')}${select('compensation','Expected hourly compensation',['$20–$25','$26–$30','$31–$35','$36–$40','$41+','Negotiable'])}<h3>Voluntary self-identification</h3>${select('gender','Gender',['Male','Female','Non-binary','Self-describe','Prefer not to answer'])}${select('veteran','Veteran status',['Protected veteran','Not a protected veteran','Prefer not to answer'])}${select('disability','Disability status',['Yes','No','Prefer not to answer'])}`,
()=>`<h2>Review & Submit</h2><p class="muted small">Verify your answers before finishing this simulation.</p><div id="review"></div>${choice('accuracy','I confirm the information is accurate',['I agree'],false,true)}${choice('consent','I understand this is a simulated application',['I agree'],false,true)}`];
function save(){document.querySelectorAll('#content input,#content select,#content textarea').forEach(el=>{if(el.type==='checkbox'){answers[el.name]=[...document.querySelectorAll(`#content input[type="checkbox"][name="${el.name}"]:checked`)].map(x=>x.value)}else if(el.type==='radio'){if(el.checked)answers[el.name]=el.value}else if(el.type==='file'){if(el.files.length)answers[el.name]=el.files[0].name}else answers[el.name]=el.value});localStorage.setItem('mockSWEAnswers',JSON.stringify(answers))}
function restore(){document.querySelectorAll('#content input,#content select,#content textarea').forEach(el=>{const v=answers[el.name];if(v===undefined||el.type==='file')return;if(el.type==='checkbox')el.checked=Array.isArray(v)&&v.includes(el.value);else if(el.type==='radio')el.checked=v===el.value;else el.value=v})}
function validate(){for(const el of document.querySelectorAll('#content input[required],#content select[required]')){if(!el.value||!el.validity.valid){$('error').textContent='Please enter a valid value for '+(el.closest('.field')?.innerText.trim()||el.name);el.focus();return false}}for(const name of [...new Set([...document.querySelectorAll('#content [data-required-group]')].map(x=>x.name))]){if(!document.querySelector(`#content input[name="${name}"]:checked`)){$('error').textContent='Please answer: '+name;return false}}return true}
function render(){ $('error').textContent='';$('nav').innerHTML=titles.map((x,i)=>`<button type="button" class="${i===page?'active':''}" ${i>page?'disabled':''}>${i+1}. ${x}</button>`).join('');$('step').textContent=`Step ${page+1} of 5`;$('bar').style.width=((page+1)*20)+'%';$('content').innerHTML=screens[page]();restore();$('back').disabled=page===0;$('next').textContent=page===4?'Submit Practice Application ✓':'Save & Continue →';if(page===4){const groups=[['Personal Information',['firstName','lastName','email','phone','city','state','github']],['Education',['school','degree','major','gpa','educationStart','graduation']],['Experience & Skills',['employer','jobTitle','languages','tools','projectName','resume']],['Eligibility',['authorized','sponsorship','availableStart','availableEnd','office']]];$('review').innerHTML=groups.map(([title,keys])=>`<div class="review"><strong>${title}</strong>${keys.map(k=>`<p><strong>${esc(k.replace(/([A-Z])/g,' $1'))}:</strong> ${esc(Array.isArray(answers[k])?answers[k].join(', '):answers[k]||'Not provided')}</p>`).join('')}</div>`).join('')}}
$('back').onclick=()=>{save();if(page>0){page--;render()}};$('next').onclick=()=>{save();if(!validate())return;if(page<4){page++;render();window.scrollTo(0,0)}else{const payload={submittedAt:new Date().toISOString(),...answers};console.log('MOCK_APPLICATION_SUBMITTED',payload);$('form').innerHTML=`<div class="success"><div class="check">✓</div><h2>Application submitted (simulation)</h2><p class="muted">Your five-page test is complete. No information was sent to a server.</p><button type="button" class="btn primary" id="restart">Start over</button></div>`;$('restart').onclick=()=>{localStorage.removeItem('mockSWEAnswers');location.reload()};$('bar').style.width='100%'}};render();
</script></body></html>
