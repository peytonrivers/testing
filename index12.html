<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Upload | Acme Technologies</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.header{background:#fff;border-bottom:1px solid #ddd;padding:20px 40px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#666}.container{width:700px;max-width:90%;margin:35px auto;background:white;padding:35px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}h2{margin-top:0}.section-title{margin-top:30px;margin-bottom:18px;padding-bottom:8px;border-bottom:1px solid #ddd;font-size:18px;font-weight:bold}label{display:block;font-weight:bold;margin-bottom:9px}.required{color:#d93025}input[type=file]{width:100%;padding:13px;border:1px solid #aaa;border-radius:5px;background:white;font-size:15px}input[type=file]:focus{outline:2px solid #4285f4}.hint{margin-top:9px;color:#777;font-size:13px}.selected{margin-top:12px;color:#1769aa;font-size:14px;overflow-wrap:anywhere}.submit-button{margin-top:25px;width:100%;padding:14px;border:0;border-radius:5px;background:#1769aa;color:white;font-size:16px;font-weight:bold;cursor:pointer}.submit-button:hover{background:#12558a}#result{display:none;margin-top:25px;padding:15px;background:#e9f7ef;border:1px solid #79c99e;border-radius:5px}.error{border-color:#d93025!important}
</style>
</head>
<body>
<header class="header"><h1>Acme Technologies</h1><p>Software Engineer Intern Application</p></header>
<main class="container">
<h2>Job Application</h2>
<p>Please upload your resume to continue your application.</p>
<div class="section-title">Resume</div>
<form id="resumeForm">
<label for="resume">Upload Resume <span class="required">*</span></label>
<input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
<div class="hint">Accepted file types: PDF, DOC, DOCX.</div>
<div class="selected" id="selectedFile" aria-live="polite"></div>
<button type="submit" class="submit-button">Submit Application</button>
</form>
<div id="result" role="status">Resume selected successfully. This is a local test form; no file was uploaded to a server.</div>
</main>
<script>
const form=document.getElementById('resumeForm');
const input=document.getElementById('resume');
const selected=document.getElementById('selectedFile');
const result=document.getElementById('result');
input.addEventListener('change',()=>{selected.textContent=input.files.length?'Selected file: '+input.files[0].name:'';input.classList.remove('error');result.style.display='none';});
form.addEventListener('submit',event=>{event.preventDefault();if(!input.files.length){input.classList.add('error');input.reportValidity();return;}const name=input.files[0].name;if(!/\.(pdf|doc|docx)$/i.test(name)){input.classList.add('error');alert('Please select a PDF, DOC, or DOCX file.');return;}result.style.display='block';result.scrollIntoView({behavior:'smooth',block:'nearest'});});
</script>
</body>
</html>
